name: Build and Release Emoji Modules

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Files/**/*.ttf"
      - "Files/*.ttf"
      # One-shot full rebuild marker; remove after the next all-fonts release.
      - ".github/force-build-all-once"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select font files
        id: fonts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build
          : > build/font-files.txt

          # Build every font when:
          # - manual workflow_dispatch, or
          # - the one-shot marker .github/force-build-all-once is present
          # Otherwise keep the default: only newly added/renamed fonts.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -f .github/force-build-all-once ]; then
            if [ -f .github/force-build-all-once ]; then
              echo "One-shot force-build-all-once marker present; building all fonts from Files/"
            else
              echo "Manual workflow_dispatch; building all fonts from Files/"
            fi
            find Files -type f -iname '*.ttf' | sort > build/font-files.txt
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            diff_base="$before"

            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              diff_base="$(git rev-list --max-parents=0 "$after")"
            fi

            while IFS=$'\t' read -r status first_path second_path; do
              case "$status" in
                A*)
                  font_path="$first_path"
                  ;;
                R*)
                  font_path="$second_path"
                  ;;
                *)
                  continue
                  ;;
              esac

              if [ -f "$font_path" ]; then
                printf '%s\n' "$font_path" >> build/font-files.txt
              fi
            done < <(git diff --name-status --find-renames "$diff_base" "$after" -- 'Files/*.ttf' 'Files/**/*.ttf')

            sort -u build/font-files.txt -o build/font-files.txt
          fi

          font_count="$(wc -l < build/font-files.txt | tr -d ' ')"
          {
            echo "count=${font_count}"
            if [ "$font_count" -gt 0 ]; then
              echo "should_build=true"
            else
              echo "should_build=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Read module and commit metadata
        id: meta
        if: steps.fonts.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          get_prop() {
            local key="$1"
            grep -m1 "^${key}=" module.prop | cut -d'=' -f2-
          }

          module_id="$(get_prop id)"
          module_author="$(get_prop author)"
          module_description="$(get_prop description)"
          source_module_name="$(get_prop name)"
          source_module_version="$(get_prop version)"
          source_module_version_code="$(get_prop versionCode)"

          short_sha="$(git rev-parse --short HEAD)"
          full_sha="$(git rev-parse HEAD)"
          commit_subject="$(git log -1 --format=%s)"
          commit_author="$(git log -1 --format=%an)"
          commit_date="$(git log -1 --date=iso-strict --format=%ad)"
          branch_name="${GITHUB_REF_NAME}"
          release_date="$(TZ=Asia/Dhaka date +%d%m%Y)"
          release_tag="${module_id}-${release_date}-${short_sha}"
          release_name="Emoji Modules ${release_date} (${short_sha})"

          {
            echo "module_id=${module_id}"
            echo "module_author=${module_author}"
            echo "module_description=${module_description}"
            echo "source_module_name=${source_module_name}"
            echo "source_module_version=${source_module_version}"
            echo "source_module_version_code=${source_module_version_code}"
            echo "short_sha=${short_sha}"
            echo "full_sha=${full_sha}"
            echo "commit_subject=${commit_subject}"
            echo "commit_author=${commit_author}"
            echo "commit_date=${commit_date}"
            echo "branch_name=${branch_name}"
            echo "release_date=${release_date}"
            echo "release_tag=${release_tag}"
            echo "release_name=${release_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Build module zips
        id: build
        if: steps.fonts.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          module_id="${{ steps.meta.outputs.module_id }}"
          module_author="${{ steps.meta.outputs.module_author }}"
          module_description="${{ steps.meta.outputs.module_description }}"
          build_version="${{ steps.meta.outputs.short_sha }}"

          mkdir -p build/packages build/releases
          : > build/release-modules.md

          while IFS= read -r font_path; do
            [ -n "$font_path" ] || continue

            font_file="$(basename "$font_path")"
            font_title="${font_file%.*}"
            module_name="[Emoji] ${font_title}"
            safe_font_name="$(printf '%s' "$font_title" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"
            variant_id="$(printf '%s' "$safe_font_name" | tr '[:upper:]' '[:lower:]')"
            build_version_code="$(shuf -i 100000000-2147483647 -n 1)"
            package_dir="build/packages/${safe_font_name}"
            asset_name="${safe_font_name}-${build_version_code}-${build_version}.zip"

            rm -rf "$package_dir"
            mkdir -p "$package_dir"
            find . -mindepth 1 -maxdepth 1 \
              ! -name '.git' \
              ! -name '.github' \
              ! -name '.gitattributes' \
              ! -name 'build' \
              ! -name 'Files' \
              ! -name 'LICENSE' \
              -exec cp -a {} "$package_dir"/ \;

            cp -f "$font_path" "$package_dir/Emoji.ttf"
            {
              printf 'id=%s\n' "${module_id}-${variant_id}"
              printf 'name=%s\n' "$module_name"
              printf 'version=%s\n' "$build_version"
              printf 'versionCode=%s\n' "$build_version_code"
              printf 'author=%s\n' "$module_author"
              printf 'description=%s\n' "$module_description"
            } > "$package_dir/module.prop"

            (
              cd "$package_dir"
              zip -r "../../releases/${asset_name}" .
            )

            printf -- '- `%s` from `%s`\n' "$asset_name" "$font_path" >> build/release-modules.md
          done < build/font-files.txt

          echo "assets=build/releases/*.zip" >> "$GITHUB_OUTPUT"

      - name: Create release notes
        id: notes
        if: steps.fonts.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "body<<EOF"
            printf '%s\n' "## Built Modules"
            cat build/release-modules.md
            printf '%s\n' ""
            printf '%s\n' "## Build Information"
            printf '%s\n' "- Build version: \`${{ steps.meta.outputs.short_sha }}\`"
            printf '%s\n' "- Font modules built: \`${{ steps.fonts.outputs.count }}\`"
            printf '%s\n' ""
            printf '%s\n' "## Commit Information"
            printf '%s\n' "- Commit: \`${{ steps.meta.outputs.short_sha }}\`"
            printf '%s\n' "- Full SHA: \`${{ steps.meta.outputs.full_sha }}\`"
            printf '%s\n' "- Message: ${{ steps.meta.outputs.commit_subject }}"
            printf '%s\n' "- Author: ${{ steps.meta.outputs.commit_author }}"
            printf '%s\n' "- Date: ${{ steps.meta.outputs.commit_date }}"
            printf '%s\n' "- Branch: \`${{ steps.meta.outputs.branch_name }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        if: steps.fonts.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emoji-module-builds
          path: build/releases/*.zip

      - name: Create GitHub release
        if: steps.fonts.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          body: ${{ steps.notes.outputs.body }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.build.outputs.assets }}
          make_latest: true

      - name: Skip release
        if: steps.fonts.outputs.should_build != 'true'
        shell: bash
        run: |
          echo "No fonts selected for build; skipping release."
          echo "Default push builds only new/renamed Files/*.ttf."
          echo "Full rebuilds: workflow_dispatch, or temporary .github/force-build-all-once marker."
